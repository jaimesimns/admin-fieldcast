color:var(--border);color:var(--muted);}\n\n/* Exp editor */\n.ed-back{display:flex;align-items:center;gap:5px;padding:8px 14px;border-bottom:1px solid var(--pb);font-size:.6rem;color:var(--muted);cursor:pointer;flex-shrink:0;transition:color .2s;}\n.ed-back:hover{color:var(--paper);}\n.ed-meta-sec{padding:12px 14px;border-bottom:1px solid var(--pb);}\n.ed-title-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}\n.ed-title-inp{font-family:'FS Bodrum Regular 14','Space Grotesk',sans-serif;font-weight:700;font-size:.95rem;flex:1;background:transparent;border:none;color:var(--paper);outline:none;border-bottom:1px solid transparent;padding-bottom:2px;transition:border-color .2s;}\n.ed-title-inp:focus{border-color:var(--exp);}\n.ed-title-inp::placeholder{color:var(--muted);font-weight:400;font-family:'Poppins',sans-serif;}\n.status-badge{font-size:.52rem;padding:2px 7px;border-radius:9px;border:1px solid;flex-shrink:0;}\n.status-badge.published{border-color:var(--signal);color:var(--signal);background:rgba(63,143,127,.07);}\n.status-badge.draft{border-color:var(--border);color:var(--muted);}\n.status-seg{display:flex;gap:4px;margin-bottom:8px;}\n.seg-btn{flex:1;padding:6px 4px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Poppins',sans-serif;font-size:.56rem;letter-spacing:.03em;cursor:pointer;transition:all .15s;}\n.seg-btn:hover{border-color:rgba(16,48,40,.25);}\n.seg-btn.on.draft{border-color:var(--muted);color:var(--paper);background:rgba(16,48,40,.06);}\n.seg-btn.on.coming_soon{border-color:var(--accent);color:var(--accent);background:rgba(177,84,63,.08);}\n.seg-btn.on.published{border-color:var(--signal);color:var(--signal);background:rgba(63,143,127,.08);}\n.ed-fields{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;}\n.ed-inp{width:100%;background:rgba(16,48,40,.04);border:1px solid var(--border);border-radius:5px;padding:6px 9px;color:var(--paper);font-family:'Poppins',sans-serif;font-size:.68rem;outline:none;transition:border-color .2s;}\n.ed-inp:focus{border-color:var(--exp);}\n.ed-inp::placeholder{color:var(--muted);}\n.ed-inp.full{grid-column:1/-1;}\n.ed-actions{display:flex;gap:5px;flex-wrap:wrap;}\n.ed-btn{padding:5px 11px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Poppins',sans-serif;font-size:.58rem;cursor:pointer;transition:all .15s;white-space:nowrap;}\n.ed-btn.save{border-color:rgba(11,74,63,.5);color:var(--exp);}\n.ed-btn.save:hover{background:rgba(11,74,63,.1);}\n.ed-btn.pub{border-color:rgba(63,143,127,.4);color:var(--signal);}\n.ed-btn.pub:hover{background:rgba(63,143,127,.07);}\n.ed-btn.exp-btn{border-color:rgba(79,157,110,.4);color:var(--ok);}\n.ed-btn.exp-btn:hover{background:rgba(79,157,110,.07);}\n.ed-btn.del{border-color:rgba(177,84,63,.3);color:var(--accent);}\n.ed-btn.del:hover{background:rgba(177,84,63,.07);}\n\n/* Item list */\n.ilist-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--pb);}\n.ilist-lbl{font-size:.58rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;}\n.btn-add-item{padding:4px 10px;background:var(--signal);color:var(--ink);border:none;border-radius:5px;font-family:'FS Bodrum Regular 14','Space Grotesk',sans-serif;font-weight:700;font-size:.62rem;cursor:pointer;transition:all .15s;}\n.btn-add-item:hover{box-shadow:0 2px 10px rgba(63,143,127,.3);}\n.irow{display:flex;align-items:center;gap:7px;padding:8px 10px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:5px;cursor:pointer;transition:all .15s;user-select:none;}\n.irow:hover{border-color:rgba(16,48,40,.12);}\n.irow.active-row{border-color:var(--signal2);background:rgba(87,194,196,.04);}\n/* double-click hint on item rows */\n.irow .dbl-hint{font-size:.5rem;color:var(--muted);opacity:0;transition:opacity .2s;margin-left:auto;white-space:nowrap;flex-shrink:0;}\n.irow:hover .dbl-hint{opacity:.5;}\n.irow-ord{display:flex;flex-direction:column;gap:1px;}\n.ord-btn{width:18px;height:15px;border-radius:3px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:.48rem;display:flex;align-items:center;justify-content:center;transition:all .12s;}\n.ord-btn:hover:not(:disabled){border-color:var(--exp);color:var(--exp);}\n.ord-btn:disabled{opacity:.18;cursor:not-allowed;}\n.irow-num{width:19px;height:19px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:.56rem;flex-shrink:0;color:var(--muted);}\n.irow-icon{font-size:1rem;flex-shrink:0;}\n.irow-info{flex:1;min-width:0;}\n.irow-title{font-family:'FS Bodrum Regular 14','Space Grotesk',sans-serif;font-weight:600;font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\n.irow-meta{font-size:.54rem;color:var(--muted);margin-top:2px;display:flex;gap:4px;flex-wrap:wrap;}\n.tag{padding:1px 5px;border-radius:3px;border:1px solid;font-size:.5rem;}\n.tag.cloud{border-color:rgba(79,157,110,.3);color:var(--ok);}\n.tag.loc{border-color:rgba(87,194,196,.3);color:var(--signal2);}\n.tag.warn{border-color:rgba(177,84,63,.3);color:var(--accent);}\n.irow-btns{display:flex;gap:3px;flex-shrink:0;}\n.irow-btn{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.62rem;transition:all .12s;}\n.irow-btn:hover{border-color:var(--signal2);color:var(--signal2);}\n.irow-btn.del:hover{border-color:var(--accent);color:var(--accent);}\n.irow-empty{padding:28px 16px;text-align:center;font-size:.68rem;color:var(--muted);line-height:1.7;}\n\n/* ITEM EDITOR PANEL */\n#itemEditorPanel{position:absolute;inset:0;background:var(--panel);display:none;flex-direction:column;overflow:hidden;animation:slideIn .18s ease;z-index:10;}\n#itemEditorPanel.open{display:flex;}\n.ie-topbar{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--pb);flex-shrink:0;}\n.ie-title-text{font-family:'FS Bodrum Regular 14','Space Grotesk',sans-serif;font-weight:700;font-size:.82rem;}\n.ie-close-btn{padding:4px 9px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Poppins',sans-serif;font-size:.58rem;cursor:pointer;}\n.ie-close-btn:hover{border-color:var(--accent);color:var(--accent);}\n.ie-scroll{flex:1;overflow-y:auto;padding:12px 14px 28px;}\n.ie-scroll::-webkit-scrollbar{width:3px;}\n.ie-scroll::-webkit-scrollbar-thumb{background:var(--pb);}\n\n/* Type chips */\n.ie-type-row{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap;}\n.tc{padding:4px 11px;border-radius:20px;border:1px solid var(--border);background:rgba(16,48,40,.03);font-size:.6rem;color:var(--muted);cursor:pointer;transition:all .2s;}\n.tc.sel.audio{border-color:var(--signal);background:rgba(63,143,127,.08);color:var(--signal);}\n.tc.sel.photo{border-color:var(--signal2);background:rgba(87,194,196,.06);color:var(--signal2);}\n.tc.sel.scan3d{border-color:var(--accent);background:rgba(177,84,63,.06);color:var(--accent);}\n.tc.locked{opacity:.3;pointer-events:none;}\n\n/* Form */\n.fg{margin-bottom:10px;}\n.fl{display:block;font-size:.56rem;letter-spacing:.08em;color:var(--muted);margin-bottom:4px;text-transform:uppercase;}\n.fi{width:100%;background:rgba(16,48,40,.05);border:1px solid var(--border);border-radius:6px;padding:7px 10px;color:var(--paper);font-family:'Poppins',sans-serif;font-size:.74rem;outline:none;transition:border-color .2s;}\n.fi:focus{border-color:var(--signal);}\n.fi::placeholder{color:var(--muted);}\ntextarea.fi{resize:vertical;min-height:52px;line-height:1.5;}\nselect.fi{cursor:pointer;}\n.file-drop{border:1px dashed var(--border);border-radius:12px;padding:12px;text-align:center;position:relative;cursor:pointer;transition:all .2s;}\n.file-drop:hover{border-color:var(--signal);background:rgba(63,143,127,.03);}\n.file-drop input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;}\n.fd-icon{font-size:1.1rem;margin-bottom:3px;}\n.fd-txt{font-size:.6rem;color:var(--muted);}\n.fd-name{font-size:.62rem;color:var(--signal);margin-top:3px;}\n.existing-media{background:rgba(16,48,40,.03);border:1px solid var(--border);border-radius:6px;padding:5px 9px;font-size:.62rem;color:var(--muted);margin-bottom:5px;display:flex;align-items:center;gap:5px;}\n.existing-media a{color:var(--signal2);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}\n.existing-media a:hover{text-decoration:underline;}\n.replace-lbl{font-size:.54rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;margin-top:4px;display:block;}\n.rec-row{display:flex;align-items:center;gap:9px;margin-top:5px;}\n.btn-rec{width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);background:rgba(177,84,63,.07);color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.86rem;flex-shrink:0;transition:all .15s;}\n.btn-rec.on{background:var(--accent);color:#fff;animation:blink 1s infinite;}\n.rec-timer{font-size:.68rem;color:var(--muted);}\n.rec-timer.on{color:var(--accent);}\n.rec-status{font-size:.6rem;color:var(--muted);}\n\n/* LOCATION BOX */\n.loc-box{background:rgba(87,194,196,.03);border:1px solid rgba(87,194,196,.12);border-radius:8px;padding:10px 11px;margin-bottom:10px;}\n.loc-box-lbl{font-size:.54rem;letter-spacing:.1em;text-transform:uppercase;color:var(--signal2);margin-bottom:8px;}\n.loc-search-wrap{position:relative;margin-bottom:7px;}\n.loc-results{position:absolute;top:calc(100%+3px);left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:7px;z-index:3000;max-height:180px;overflow-y:auto;display:none;}\n.loc-results.open{display:block;}\n.loc-result-item{padding:7px 10px;font-size:.66rem;cursor:pointer;border-bottom:1px solid var(--border);line-height:1.4;}\n.loc-result-item:last-child{border-bottom:none;}\n.loc-result-item:hover{background:rgba(87,194,196,.08);color:var(--signal2);}\n.loc-result-name{font-size:.68rem;color:var(--paper);}\n.loc-result-sub{font-size:.56rem;color:var(--muted);margin-top:1px;}\n.loc-loading{padding:7px 10px;font-size:.62rem;color:var(--muted);}\n.coord-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;}\n.coord-confirmed{background:rgba(87,194,196,.07);border:1px solid rgba(87,194,196,.2);border-radius:5px;padding:5px 9px;font-size:.62rem;color:var(--signal2);margin-bottom:5px;}\n.map-pin-hint{font-size:.54rem;color:var(--muted);margin-top:3px;line-height:1.5;}\n\n/* ZONE BOX */\n.zone-box{background:rgba(63,143,127,.02);border:1px solid rgba(63,143,127,.1);border-radius:8px;padding:10px 11px;margin-bottom:10px;}\n.zone-box-lbl{font-size:.54rem;letter-spacing:.1em;text-transform:uppercase;color:var(--signal);margin-bottom:10px;}\n.zone-diagram{width:100%;height:52px;border-radius:5px;display:block;margin-bottom:10px;}\n.zone-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}\n.zrl{font-size:.58rem;width:76px;flex-shrink:0;}\n.zr{-webkit-appearance:none;flex:1;height:3px;border-radius:2px;outline:none;cursor:pointer;}\n.zr::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;cursor:pointer;}\n.zr.core{background:linear-gradient(to right,rgba(63,143,127,.15),var(--signal));}\n.zr.core::-webkit-slider-thumb{background:var(--signal);}\n.zr.fade{background:linear-gradient(to right,rgba(87,194,196,.1),var(--signal2));}\n.zr.fade::-webkit-slider-thumb{background:var(--signal2);}\n.zr.vc{background:linear-gradient(to right,rgba(79,157,110,.1),var(--ok));}\n.zr.vc::-webkit-slider-thumb{background:var(--ok);}\n.zr.ve{background:linear-gradient(to right,rgba(107,104,96,.1),var(--muted));}\n.zr.ve::-webkit-slider-thumb{background:var(--muted);}\n.zv{font-size:.62rem;width:32px;text-align:right;flex-shrink:0;}\n.zone-hint{font-size:.54rem;color:var(--muted);line-height:1.55;margin-top:4px;}\n\n/* Upload */\n.up-prog{display:none;background:rgba(16,48,40,.03);border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-top:8px;}\n.up-prog.show{display:block;}\n.up-prog-top{display:flex;justify-content:space-between;font-size:.56rem;color:var(--muted);margin-bottom:5px;}\n.up-bar{height:2px;background:var(--border);border-radius:2px;overflow:hidden;}\n.up-fill{height:100%;background:var(--ok);border-radius:2px;transition:width .3s;width:0%;}\n.up-status{font-size:.58rem;color:var(--ok);margin-top:3px;display:none;}\n.up-status.show{display:block;}\n.up-status.err{color:var(--accent);}\n.ie-save{display:block;width:100%;margin-top:11px;padding:11px;border-radius:14px;border:none;background:var(--signal);color:var(--ink);font-family:'FS Bodrum Regular 14','Space Grotesk',sans-serif;font-weight:700;font-size:.85rem;cursor:pointer;transition:all .15s;}\n.ie-save:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(63,143,127,.3);}\n.ie-save:disabled{opacity:.5;cursor:not-allowed;transform:none;}\n.ie-save.photo{background:var(--signal2);}\n.ie-save.scan3d{background:var(--accent);color:#fff;}\n.ie-cancel{display:block;width:100%;margin-top:5px;padding:8px;background:transparent;border:none;color:var(--muted);font-family:'Poppins',sans-serif;font-size:.68rem;cursor:pointer;}\n.ie-delete{display:block;width:100%;margin-top:8px;padding:9px;border-radius:8px;border:1px solid rgba(177,84,63,.35);background:rgba(177,84,63,.06);color:var(--accent);font-family:'Poppins',sans-serif;font-size:.66rem;letter-spacing:.04em;cursor:pointer;transition:all .15s;}\n.ie-delete:hover{background:rgba(177,84,63,.14);}\n\n/* MAP */\n#mapArea{flex:1;position:relative;min-width:0;}\n#map{width:100%;height:100%;background:#e9ece3;}\n.leaflet-tile-pane{filter:grayscale(.3) sepia(.12) hue-rotate(100deg) saturate(.7) brightness(1.05) contrast(.95);}\n.leaflet-control-attribution{display:none!important;}\n\n/* Map toolbar */\n#mapToolbar{position:absolute;top:10px;right:10px;z-index:900;display:flex;flex-direction:column;gap:5px;}\n.mt-btn{width:34px;height:34px;border-radius:10px;border:1px solid rgba(16,48,40,.11);background:rgba(255,255,255,.82);backdrop-filter:blur(6px);color:var(--paper);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.88rem;transition:all .15s;}\n.mt-btn:hover{border-color:var(--signal2);color:var(--signal2);}\n\n/* Draw hint overlay */\n#drawHint{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.9);border:1px solid var(--signal2);border-radius:7px;padding:6px 13px;font-size:.66rem;color:var(--signal2);z-index:900;pointer-events:none;display:none;white-space:nowrap;}\n#drawHint.on{display:block;}\n\n/* Now-playing strip */\n#npStrip{position:absolute;top:10px;left:10px;z-index:800;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);border:1px solid rgba(16,48,40,.1);border-radius:16px;padding:7px 10px;display:none;align-items:center;gap:8px;max-width:250px;}\n#npStrip.on{display:flex;}\n.np-wave{display:flex;align-items:center;gap:2px;height:18px;}\n.wb{width:3px;background:var(--signal);border-radius:2px;animation:wave 1.2s ease-in-out infinite;}\n.wb:nth-child(1){animation-delay:0s}.wb:nth-child(2){animation-delay:.1s}.wb:nth-child(3){animation-delay:.2s}.wb:nth-child(4){animation-delay:.3s}.wb:nth-child(5){animation-delay:.4s}.wb:nth-child(6){animation-delay:.2s}.wb:nth-child(7){animation-delay:.1s}\n.np-wave.paused .wb{animation-play-state:paused;height:4px;}\n.np-info{flex:1;min-width:0;}\n.np-title-t{font-family:'FS Bodrum Regular 14','Space Grotesk',sans-serif;font-size:.74rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}\n.np-meta-t{font-size:.54rem;color:var(--muted);margin-top:1px;}\n.np-btns{display:flex;gap:3px;}\n.np-btn{width:25px;height:25px;border-radius:50%;border:1px solid var(--signal);background:transparent;color:var(--signal);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.7rem;transition:all .12s;}\n.np-btn:hover{background:var(--signal);color:var(--ink);}\n.np-btn.stp{border-color:var(--border);color:var(--muted);}\n.np-btn.stp:hover{border-color:var(--accent);color:var(--accent);}\n\n/* Stats bar */\n#mapBar{position:absolute;bottom:10px;right:10px;z-index:800;background:rgba(255,255,255,.82);backdrop-filter:blur(6px);border:1px solid rgba(16,48,40,.07);border-radius:16px;padding:6px 11px;display:flex;gap:10px;}\n.stat{display:flex;align-items:center;gap:4px;font-size:.56rem;color:var(--muted);}\n.sd{width:5px;height:5px;border-radius:50%;}\n.sd.a{background:var(--signal)}.sd.p{background:var(--signal2)}.sd.s{background:var(--accent)}.sd.e{background:var(--exp)}.sd.c{background:var(--ok)}\n.sn{color:var(--paper);}\n\n/* Map markers */\n.mk{position:relative;cursor:pointer;}\n.mk-lbl{position:absolute;top:-22px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.9);border:1px solid rgba(16,48,40,.1);border-radius:4px;padding:2px 6px;font-size:.52rem;white-space:nowrap;color:var(--paper);pointer-events:none;}\n.mk-ring{width:34px;height:34px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);animation:pop .3s cubic-bezier(.34,1.56,.64,1);}\n.mk-ring.audio{border-color:var(--signal);background:rgba(63,143,127,.1);}\n.mk-ring.photo{border-color:var(--signal2);background:rgba(87,194,196,.1);}\n.mk-ring.scan3d{border-color:var(--accent);background:rgba(177,84,63,.1);}\n.mk-ring.isactive{animation:pulse2 2s infinite;}\n\n/* Toast */\n.toast{position:fixed;top:52px;left:50%;transform:translateX(-50%) translateY(-12px);background:var(--card);border:1px solid var(--border);border-radius:14px;padding:7px 14px;font-size:.7rem;color:var(--paper);z-index:9999;opacity:0;transition:all .28s;pointer-events:none;white-space:nowrap;}\n.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}\n.toast.ok{border-color:var(--ok);}\n.toast.err{border-color:var(--accent);}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- SETUP -->\n<div class=\"setup-overlay\" id=\"setupOverlay\">\n  <div class=\"setup-box\">\n    <div class=\"setup-logo\">STRATA<\u002Fdiv>\n    <div class=\"setup-eyebrow\">ADMIN · SUPABASE SETUP<\u002Fdiv>\n    <div class=\"setup-desc\">Connect to your Supabase project to get started.<\u002Fdiv>\n    <div class=\"setup-step\"><div class=\"step-num\">1<\u002Fdiv><div>Create a free project at <strong>supabase.com<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n    <div class=\"setup-step\"><div class=\"step-num\">2<\u002Fdiv><div>Storage → New Bucket → <code>fieldcast-media<\u002Fcode> (Public)<\u002Fdiv><\u002Fdiv>\n    <div class=\"setup-step\"><div class=\"step-num\">3<\u002Fdiv><div>Run this schema in the SQL Editor:<\u002Fdiv><\u002Fdiv>\n    <div class=\"sql-block\"><b>create table<\u002Fb> markers (\n  id text primary key, title text not null, excerpt text, description text,\n  type text not null default 'audio' check (type in ('audio','photo','scan3d')),\n  lat float8, lon float8,\n  radius int4 default 30, fade_radius int4 default 80,\n  vol_center int4 default 100, vol_edge int4 default 0,\n  media_url text, media_name text, direction text, scan_type text,\n  created_at timestamptz default now()\n);\n<b>create table<\u002Fb> experiences (\n  id text primary key, title text not null, tagline text,\n  description text, location_label text, cover_url text, duration text,\n  status text default 'draft' check (status in ('draft','coming_soon','published')),\n  marker_ids text[] default '{}',\n  created_at timestamptz default now(), updated_at timestamptz default now()\n);\n<b>alter table<\u002Fb> markers <b>enable row level security<\u002Fb>;\n<b>alter table<\u002Fb> experiences <b>enable row level security<\u002Fb>;\n<b>create policy<\u002Fb> \"Public read\" <b>on<\u002Fb> markers <b>for select using<\u002Fb> (true);\n<b>create policy<\u002Fb> \"Public read\" <b>on<\u002Fb> experiences <b>for select using<\u002Fb> (true);\n<b>create policy<\u002Fb> \"Anon write\" <b>on<\u002Fb> markers <b>for all using<\u002Fb> (true);\n<b>create policy<\u002Fb> \"Anon write\" <b>on<\u002Fb> experiences <b>for all using<\u002Fb> (true);<\u002Fdiv>\n    <div class=\"setup-step\"><div class=\"step-num\">4<\u002Fdiv><div>Paste your Project URL and anon key:<\u002Fdiv><\u002Fdiv>\n    <input class=\"setup-input\" id=\"inUrl\" type=\"url\" placeholder=\"https://xxxx.supabase.co\" autocomplete=\"off\">\n    <input class=\"setup-input\" id=\"inKey\" type=\"text\" placeholder=\"anon public key (eyJ...)\" autocomplete=\"off\">\n    <button class=\"btn-setup\" id=\"btnConnect\">Connect &amp; Continue →<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- SUPABASE BAR -->\n<div id=\"sbBar\"><div class=\"sb-dot\"><\u002Fdiv><span id=\"sbLabel\">Connected<\u002Fspan><button onclick=\"toast('Credentials are hardcoded','err')\">disconnect<\u002Fbutton><\u002Fdiv>\n\n<!-- HEADER -->\n<header>\n  <div class=\"logo\">STRATA<sub>ADMIN<\u002Fsub><\u002Fdiv>\n  <div class=\"hdr-search\">\n    <input class=\"hdr-search-input\" id=\"hdrSearchInput\" type=\"text\" placeholder=\"🔍  Search map…\" autocomplete=\"off\">\n    <div class=\"hdr-search-drop\" id=\"hdrSearchDrop\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"hdr-tabs\">\n    <button class=\"htab on\" id=\"htabMap\" onclick=\"switchTab('map')\">MAP<\u002Fbutton>\n    <button class=\"htab exp\" id=\"htabExp\" onclick=\"switchTab('exp')\">EXPERIENCES<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- WORKSPACE -->\n<div id=\"workspace\">\n\n  <!-- LEFT PANEL -->\n  <div id=\"leftPanel\">\n\n    <!-- MAP TAB PANEL -->\n    <div id=\"mapPanel\" style=\"display:flex;flex-direction:column;height:100%;overflow:hidden;position:relative;\">\n      <div class=\"panel-hdr\">\n        <span class=\"panel-title\" id=\"mapPanelTitle\">Items<\u002Fspan>\n        <div class=\"panel-actions\">\n          <button class=\"pa-btn\" onclick=\"viewUnassigned()\" title=\"Browse items not linked to any experience\">⚠ Unassigned<\u002Fbutton>\n          <button class=\"pa-btn add\" onclick=\"openItemEditor(null)\">+ Add item<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- item list -->\n      <div class=\"panel-scroll\" id=\"itemListScroll\" style=\"flex:1;\">\n        <div style=\"padding:6px;\" id=\"itemRows\"><div class=\"irow-empty\">Select an experience first.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <!-- item editor (absolute overlay inside mapPanel) -->\n      <div id=\"itemEditorPanel\">\n        <div class=\"ie-topbar\">\n          <span class=\"ie-title-text\" id=\"ieTitleText\">New item<\u002Fspan>\n          <button class=\"ie-close-btn\" onclick=\"closeItemEditor()\">✕ close<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"ie-scroll\" id=\"ieScroll\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- EXP TAB PANEL -->\n    <div id=\"expPanel\" style=\"display:none;flex-direction:column;height:100%;overflow:hidden;position:relative;\">\n      <div class=\"panel-hdr\">\n        <span class=\"panel-title\">Experiences<\u002Fspan>\n        <div class=\"panel-actions\">\n          <button class=\"pa-btn new\" onclick=\"newExp()\">+ New<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"panel-scroll\" id=\"expListScroll\" style=\"flex:1;\">\n        <div class=\"exp-list-inner\" id=\"expList\"><div class=\"panel-empty\">No experiences yet.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <!-- exp editor (absolute overlay) -->\n      <div id=\"expEditorPanel\" style=\"position:absolute;inset:0;background:var(--panel);display:none;flex-direction:column;overflow:hidden;z-index:10;\">\n        <div class=\"ed-back\" onclick=\"closeExpEditor()\">← all experiences<\u002Fdiv>\n        <div style=\"flex:1;overflow-y:auto;\">\n          <div class=\"ed-meta-sec\">\n            <div class=\"ed-title-row\">\n              <input class=\"ed-title-inp\" id=\"edTitle\" placeholder=\"Experience title…\" maxlength=\"80\">\n            <\u002Fdiv>\n            <div class=\"ed-fields\">\n              <input class=\"ed-inp\" id=\"edTagline\" placeholder=\"Tagline…\">\n              <input class=\"ed-inp\" id=\"edLocation\" placeholder=\"Location e.g. ENCI Quarry\">\n              <input class=\"ed-inp\" id=\"edDuration\" placeholder=\"Duration e.g. 45 min\">\n              <input class=\"ed-inp full\" id=\"edDesc\" placeholder=\"Description for visitors…\">\n              <input class=\"ed-inp full\" id=\"edCover\" placeholder=\"Cover image URL (optional)\">\n            <\u002Fdiv>\n            <div class=\"status-seg\" id=\"statusSeg\">\n              <button class=\"seg-btn\" data-status=\"draft\" onclick=\"setStatus('draft')\">DRAFT<\u002Fbutton>\n              <button class=\"seg-btn\" data-status=\"coming_soon\" onclick=\"setStatus('coming_soon')\">COMING SOON<\u002Fbutton>\n              <button class=\"seg-btn\" data-status=\"published\" onclick=\"setStatus('published')\">PUBLISHED<\u002Fbutton>\n            <\u002Fdiv>\n            <div class=\"ed-actions\">\n              <button class=\"ed-btn save\" onclick=\"saveExp()\">☁ SAVE<\u002Fbutton>\n              <button class=\"ed-btn exp-btn\" onclick=\"exportExp()\">↓ JSON<\u002Fbutton>\n              <button class=\"ed-btn del\" onclick=\"deleteExp()\">DELETE<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"ilist-hdr\">\n            <span class=\"ilist-lbl\" id=\"edItemCount\">0 items<\u002Fspan>\n            <button class=\"btn-add-item\" onclick=\"switchTab('map');openItemEditor(null)\">+ Add item<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"padding:6px;\" id=\"edItemRows\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv><!-- #leftPanel -->\n\n  <!-- MAP AREA -->\n  <div id=\"mapArea\">\n    <div id=\"map\"><\u002Fdiv>\n    <div id=\"mapToolbar\">\n      <button class=\"mt-btn\" onclick=\"map.zoomIn()\">+<\u002Fbutton>\n      <button class=\"mt-btn\" onclick=\"map.zoomOut()\">−<\u002Fbutton>\n    <\u002Fdiv>\n    <div id=\"drawHint\">Click on the map to place pin · drag ◉ handles to resize zones<\u002Fdiv>\n    <div id=\"npStrip\">\n      <div class=\"np-wave\" id=\"npWave\">\n        <div class=\"wb\" style=\"height:8px\"><\u002Fdiv><div class=\"wb\" style=\"height:13px\"><\u002Fdiv><div class=\"wb\" style=\"height:18px\"><\u002Fdiv><div class=\"wb\" style=\"height:10px\"><\u002Fdiv><div class=\"wb\" style=\"height:20px\"><\u002Fdiv><div class=\"wb\" style=\"height:12px\"><\u002Fdiv><div class=\"wb\" style=\"height:6px\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"np-info\"><div class=\"np-title-t\" id=\"npTitle\">—<\u002Fdiv><div class=\"np-meta-t\" id=\"npMeta\">—<\u002Fdiv><\u002Fdiv>\n      <div class=\"np-btns\">\n        <button class=\"np-btn\" id=\"btnPP\">▶<\u002Fbutton>\n        <button class=\"np-btn stp\" id=\"btnStop\">■<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"mapBar\">\n      <div class=\"stat\"><div class=\"sd a\"><\u002Fdiv><span class=\"sn\" id=\"cA\">0<\u002Fspan> audio<\u002Fdiv>\n      <div class=\"stat\"><div class=\"sd p\"><\u002Fdiv><span class=\"sn\" id=\"cP\">0<\u002Fspan> photo<\u002Fdiv>\n      <div class=\"stat\"><div class=\"sd s\"><\u002Fdiv><span class=\"sn\" id=\"cS\">0<\u002Fspan> 3D<\u002Fdiv>\n      <div class=\"stat\"><div class=\"sd e\"><\u002Fdiv><span class=\"sn\" id=\"cE\">0<\u002Fspan> exp<\u002Fdiv>\n      <div class=\"stat\"><div class=\"sd c\"><\u002Fdiv><span class=\"sn\" id=\"cC\">0<\u002Fspan> ☁<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv><!-- #workspace -->\n<div class=\"toast\" id=\"toast\"><\u002Fdiv>\n\n<script>\n// ═══════════════════════════════════════════════\n// CREDENTIALS\n// ═══════════════════════════════════════════════\nconst { createClient } = supabase;\nconst BUCKET = 'fieldcast-media';\nconst SB_URL = 'https://gplxpnijrfnskakujtiu.supabase.co';\nconst SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwbHhwbmlqcmZuc2tha3VqdGl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMTkwNDcsImV4cCI6MjA4ODc5NTA0N30.nb24yCoTjhVBiifnkmZUOIYjkn3Xk4dqKyHPXtEBO5o';\nconst sb = createClient(SB_URL, SB_KEY);\nlocalStorage.setItem('fc_url', SB_URL); localStorage.setItem('fc_key', SB_KEY);\ndocument.getElementById('setupOverlay').classList.add('hidden');\ndocument.getElementById('sbBar').classList.add('on');\ndocument.getElementById('sbLabel').textContent = '☁ ' + SB_URL.replace('https://','').split('.')[0] + '.supabase.co';\n\n// ═══════════════════════════════════════════════\n// STATE\n// ═══════════════════════════════════════════════\nconst S = {\n  markers:[], experiences:[],\n  currentExpId:null,\n  editingMarkerId:null,\n  itemType:'audio',\n  pendingLat:null, pendingLon:null,\n  recordingBlob:null, recording:false,\n  recorder:null, recChunks:[], recInterval:null, recSeconds:0,\n  leafletMarkers:{}, coreCircles:{}, fadeCircles:{},\n  zoneHandles:[],\n  curAudio:null, curAudioEl:null,\n  drawMode:false,\n};\n\n// ═══════════════════════════════════════════════\n// MAP\n// ═══════════════════════════════════════════════\nlet map;\nwindow.addEventListener('DOMContentLoaded', async () => {\n  initMap();\n  const [mr, er] = await Promise.all([\n    sb.from('markers').select('*').order('created_at',{ascending:true}),\n    sb.from('experiences').select('*').order('created_at',{ascending:true}),\n  ]);\n  S.markers   = mr.error ? [] : (mr.data||[]);\n  S.experiences = er.error ? [] : (er.data||[]);\n  renderAllMapMarkers();\n  renderExpList();\n  if (S.experiences.length) selectExp(S.experiences[0].id);\n  updateStats();\n  toast(`☁ Loaded ${S.experiences.length} exp, ${S.markers.length} items`,'ok');\n});\n\nfunction initMap() {\n  map = L.map('map',{center:[51.505,-0.09],zoom:14,zoomControl:false,attributionControl:false});\n  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);\n  map.on('click', e => {\n    if (S.drawMode) {\n      setCoords(e.latlng.lat, e.latlng.lng);\n      if (S.editingMarkerId) {\n        const m = S.markers.find(x=>x.id===S.editingMarkerId);\n        if (m) { m.lat=e.latlng.lat; m.lon=e.latlng.lng; refreshMapMarker(m); showZoneHandles(m); }\n      }\n      toast('📍 Pin placed');\n    }\n  });\n}\n\nconst ICONS = { audio:'🎙', photo:'📷', scan3d:'🧊' };\nconst COLS  = { audio:'#e8ff3c', photo:'#3cffe8', scan3d:'#ff5c3c' };\nconst STATUS_LABEL = { draft:'DRAFT', coming_soon:'SOON', published:'LIVE' };\n\nfunction highlightStatusSeg(status){\n  document.querySelectorAll('#statusSeg .seg-btn').forEach(b=>{\n    b.classList.toggle('on',b.dataset.status===status);\n    b.classList.toggle(b.dataset.status,b.dataset.status===status);\n  });\n}\n\nfunction mkIcon(m, active=false) {\n  return L.divIcon({className:'',html:`<div class=\"mk\"><div class=\"mk-lbl\">${escHtml(m.title)}<\u002Fdiv><div class=\"mk-ring ${m.type}${active?' isactive':''}\"><span style=\"font-size:.85rem\">${ICONS[m.type]||'📍'}<\u002Fspan><\u002Fdiv><\u002Fdiv>`,iconSize:[34,34],iconAnchor:[17,17]});\n}\n\nfunction renderAllMapMarkers() {\n  Object.values(S.leafletMarkers).forEach(l=>l.remove());\n  Object.values(S.coreCircles).forEach(c=>c.remove());\n  Object.values(S.fadeCircles).forEach(c=>c.remove());\n  S.leafletMarkers={}; S.coreCircles={}; S.fadeCircles={};\n  S.markers.forEach(m=>{ if(m.lat!=null) placeMapMarker(m); });\n  updateStats();\n}\n\nfunction placeMapMarker(m) {\n  const col = COLS[m.type]||'#fff';\n  const fadeR = m.fade_radius||80, coreR = m.radius||30;\n  S.fadeCircles[m.id] = L.circle([m.lat,m.lon],{radius:fadeR,color:col,fillColor:col,fillOpacity:.04,weight:1.5,dashArray:'5 6',interactive:false}).addTo(map);\n  S.coreCircles[m.id] = L.circle([m.lat,m.lon],{radius:coreR,color:col,fillColor:col,fillOpacity:.1,weight:2,interactive:false}).addTo(map);\n\n  // ── Double-click to edit, single click to play audio (with 250 ms debounce) ──\n  let clickTimer = null;\n  const lm = L.marker([m.lat,m.lon],{icon:mkIcon(m)}).addTo(map);\n  lm.on('click', () => {\n    clearTimeout(clickTimer);\n    clickTimer = setTimeout(() => {\n      // single-click: play audio only\n      if (m.type==='audio' && m.media_url) playAudio(m);\n    }, 250);\n  });\n  lm.on('dblclick', e => {\n    L.DomEvent.stopPropagation(e); // prevent map zoom\n    clearTimeout(clickTimer);\n    switchTab('map');\n    openItemEditor(m.id);\n  });\n  S.leafletMarkers[m.id]=lm;\n}\n\nfunction removeMapMarker(id) {\n  [S.leafletMarkers,S.coreCircles,S.fadeCircles].forEach(obj=>{ if(obj[id]){obj[id].remove();delete obj[id];} });\n}\n\nfunction refreshMapMarker(m) {\n  removeMapMarker(m.id);\n  if (m.lat!=null) placeMapMarker(m);\n}\n\n// ── Zone drag handles ──────────────────────────────────\nfunction metersToLonDeg(m, lat) { return m / (111320 * Math.cos(lat * Math.PI / 180)); }\nfunction lonDegToMeters(d, lat) { return d * 111320 * Math.cos(lat * Math.PI / 180); }\n\nfunction showZoneHandles(m) {\n  clearZoneHandles();\n  if (m.lat==null) return;\n\n  const makeHandle = (radiusM, colorHex, onChange, onEnd) => {\n    const offsetDeg = metersToLonDeg(radiusM, m.lat);\n    const hIcon = L.divIcon({className:'',html:`<div style=\"width:13px;height:13px;border-radius:50%;background:${colorHex};border:2px solid #0a0a0f;cursor:ew-resize;box-shadow:0 0 0 3px ${colorHex}55\"><\u002Fdiv>`,iconSize:[13,13],iconAnchor:[6,6]});\n    const hm = L.marker([m.lat, m.lon+offsetDeg],{icon:hIcon,draggable:true,zIndexOffset:900}).addTo(map);\n    hm.on('drag', e => {\n      const newM = Math.max(5, Math.round(lonDegToMeters(Math.abs(e.latlng.lng - m.lon), m.lat)));\n      onChange(newM);\n    });\n    hm.on('dragend', () => onEnd());\n    return hm;\n  };\n\n  const coreH = makeHandle(\n    m.radius||30, '#e8ff3c',\n    r => {\n      m.radius = r;\n      if (S.coreCircles[m.id]) S.coreCircles[m.id].setRadius(r);\n      const el=document.getElementById('ieCoreR'); if(el){el.value=r;document.getElementById('ieCoreRVal').textContent=r+'m';}\n      drawZoneDiagram();\n    },\n    () => sb.from('markers').update({radius:m.radius,fade_radius:m.fade_radius}).eq('id',m.id).then(()=>toast('✓ Zone saved','ok'))\n  );\n\n  const fadeH = makeHandle(\n    m.fade_radius||80, '#3cffe8',\n    r => {\n      r = Math.max((m.radius||30)+5, r);\n      m.fade_radius = r;\n      if (S.fadeCircles[m.id]) S.fadeCircles[m.id].setRadius(r);\n      const el=document.getElementById('ieFadeR'); if(el){el.value=r;document.getElementById('ieFadeRVal').textContent=r+'m';}\n      drawZoneDiagram();\n    },\n    () => sb.from('markers').update({radius:m.radius,fade_radius:m.fade_radius}).eq('id',m.id).then(()=>toast('✓ Zone saved','ok'))\n  );\n\n  S.zoneHandles = [coreH, fadeH];\n}\n\nfunction clearZoneHandles() {\n  S.zoneHandles.forEach(h=>h.remove()); S.zoneHandles=[];\n}\n\n// ═══════════════════════════════════════════════\n// TABS\n// ═══════════════════════════════════════════════\nfunction switchTab(t) {\n  document.getElementById('htabMap').classList.toggle('on',t==='map');\n  document.getElementById('htabExp').classList.toggle('on',t==='exp');\n  document.getElementById('mapPanel').style.display  = t==='map'  ? 'flex':'none';\n  document.getElementById('expPanel').style.display  = t==='exp'  ? 'flex':'none';\n  setTimeout(()=>map&&map.invalidateSize(),60);\n}\n\n// ═══════════════════════════════════════════════\n// EXPERIENCE LIST + EDITOR\n// ═══════════════════════════════════════════════\nfunction renderExpList() {\n  const el=document.getElementById('expList');\n  if (!S.experiences.length){el.innerHTML='<div class=\"panel-empty\">No experiences yet.<br>Click + New to create one.<\u002Fdiv>';updateStats();return;}\n  el.innerHTML = S.experiences.map(exp=>{\n    const n=(exp.marker_ids||[]).length;\n    const isActive = S.currentExpId===exp.id;\n    return `<div class=\"exp-card${isActive?' active':''}\"\n        onclick=\"selectExp('${exp.id}')\"\n        ondblclick=\"selectExp('${exp.id}');switchTab('exp');openExpEditor('${exp.id}')\"\n        title=\"Double-click to open editor\">\n      <div class=\"ec-title\">${escHtml(exp.title||'Untitled')}<span class=\"dbl-hint\">✎ edit<\u002Fspan><\u002Fdiv>\n      <div class=\"ec-meta\">${n} stop${n!==1?'s':''}<\u002Fdiv>\n      <span class=\"ec-badge ${exp.status||'draft'}\">${STATUS_LABEL[exp.status]||'DRAFT'}<\u002Fspan>\n    <\u002Fdiv>`;\n  }).join('');\n  updateStats();\n}\n\nfunction selectExp(id) {\n  S.currentExpId=id;\n  renderExpList(); renderItemList();\n  const exp=S.experiences.find(e=>e.id===id);\n  document.getElementById('mapPanelTitle').textContent=exp?(exp.title||'Untitled'):'Items';\n  if(exp){\n    const geo=(exp.marker_ids||[]).map(i=>S.markers.find(m=>m.id===i)).filter(m=>m&&m.lat!=null);\n    if(geo.length>1){const lats=geo.map(m=>m.lat),lons=geo.map(m=>m.lon);map.fitBounds([[Math.min(...lats),Math.min(...lons)],[Math.max(...lats),Math.max(...lons)]],{padding:[40,40]});}\n    else if(geo.length===1) map.setView([geo[0].lat,geo[0].lon],16);\n  }\n}\n\nfunction openExpEditor(id) {\n  const exp=S.experiences.find(e=>e.id===id); if(!exp) return;\n  document.getElementById('expListScroll').style.display='none';\n  const ep=document.getElementById('expEditorPanel'); ep.style.display='flex';\n  document.getElementById('edTitle').value=exp.title||'';\n  document.getElementById('edTagline').value=exp.tagline||'';\n  document.getElementById('edLocation').value=exp.location_label||'';\n  document.getElementById('edDuration').value=exp.duration||'';\n  document.getElementById('edDesc').value=exp.description||'';\n  document.getElementById('edCover').value=exp.cover_url||'';\n  highlightStatusSeg(exp.status||'draft');\n  renderEdItemList(exp);\n}\nfunction closeExpEditor(){\n  document.getElementById('expListScroll').style.display='';\n  document.getElementById('expEditorPanel').style.display='none';\n}\nfunction renderEdItemList(exp){\n  const ids=exp.marker_ids||[];\n  document.getElementById('edItemCount').textContent=ids.length+' item'+(ids.length!==1?'s':'');\n  const rows=document.getElementById('edItemRows');\n  if(!ids.length){rows.innerHTML='<div class=\"irow-empty\">No items yet.<\u002Fdiv>';return;}\n  const items=ids.map(id=>S.markers.find(m=>m.id===id)).filter(Boolean);\n  rows.innerHTML=items.map((m,i)=>`\n    <div class=\"irow\"\n        ondblclick=\"switchTab('map');openItemEditor('${m.id}')\"\n        title=\"Double-click to edit this item\">\n      <div class=\"irow-ord\">\n        <button class=\"ord-btn\" onclick=\"moveItem('${m.id}',-1)\" ${i===0?'disabled':''}>▲<\u002Fbutton>\n        <button class=\"ord-btn\" onclick=\"moveItem('${m.id}',1)\"  ${i===items.length-1?'disabled':''}>▼<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"irow-num\">${i+1}<\u002Fdiv>\n      <div class=\"irow-icon\">${ICONS[m.type]||'📍'}<\u002Fdiv>\n      <div class=\"irow-info\"><div class=\"irow-title\">${escHtml(m.title)}<\u002Fdiv><div class=\"irow-meta\">${m.media_url?'<span class=\"tag cloud\">☁<\u002Fspan>':''}${m.lat!=null?'<span class=\"tag loc\">📍<\u002Fspan>':''}<\u002Fdiv><\u002Fdiv>\n      <span class=\"dbl-hint\">✎ edit<\u002Fspan>\n      <div class=\"irow-btns\">\n        <button class=\"irow-btn\" onclick=\"switchTab('map');openItemEditor('${m.id}')\" title=\"Edit\">✎<\u002Fbutton>\n        <button class=\"irow-btn del\" onclick=\"removeItem('${m.id}')\" title=\"Remove\">✕<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>`).join('');\n}\n\n// autosave\nlet autoSaveT=null;\nfunction scheduleAutoSave(){\n  clearTimeout(autoSaveT);\n  autoSaveT=setTimeout(async()=>{\n    const exp=S.experiences.find(e=>e.id===S.currentExpId); if(!exp) return;\n    exp.title=document.getElementById('edTitle').value.trim()||'Untitled';\n    exp.tagline=document.getElementById('edTagline').value.trim();\n    exp.location_label=document.getElementById('edLocation').value.trim();\n    exp.duration=document.getElementById('edDuration').value.trim();\n    exp.description=document.getElementById('edDesc').value.trim();\n    exp.cover_url=document.getElementById('edCover').value.trim();\n    exp.updated_at=new Date().toISOString();\n    const{error}=await sb.from('experiences').upsert(exp);\n    if(!error){\n      renderExpList();\n      document.getElementById('mapPanelTitle').textContent=exp.title||'Untitled';\n      const b=document.querySelector('.ed-btn.save'),prev=b.textContent;\n      b.textContent='✓ SAVED'; setTimeout(()=>b.textContent=prev,1400);\n    }\n  },800);\n}\n['edTitle','edTagline','edLocation','edDuration','edDesc','edCover'].forEach(id=>{\n  const el=document.getElementById(id); if(el) el.addEventListener('input',scheduleAutoSave);\n});\n\n// ═══════════════════════════════════════════════\n// ITEM LIST (map panel)\n// ═══════════════════════════════════════════════\n// Items not referenced by any experience's marker_ids — e.g. left behind\n// after an experience was deleted (\"Items will not be deleted\"), or removed\n// from a list with the ✕ button. Otherwise invisible/unreachable once their\n// experience is gone, so they get their own browsable list here.\nfunction getUnassignedMarkers(){\n  const assigned=new Set();\n  S.experiences.forEach(e=>(e.marker_ids||[]).forEach(id=>assigned.add(id)));\n  return S.markers.filter(m=>!assigned.has(m.id));\n}\n\nfunction viewUnassigned(){\n  S.currentExpId=null;\n  switchTab('map');\n  renderExpList(); renderItemList();\n}\n\nfunction renderItemList(){\n  const exp=S.experiences.find(e=>e.id===S.currentExpId);\n  const rows=document.getElementById('itemRows');\n  const panelTitle=document.getElementById('mapPanelTitle');\n  if(!exp){\n    if(panelTitle) panelTitle.textContent='Unassigned items';\n    const orphans=getUnassignedMarkers();\n    if(!orphans.length){rows.innerHTML='<div class=\"irow-empty\">No unassigned items.<br>Select an experience to see its items.<\u002Fdiv>';return;}\n    rows.innerHTML=orphans.map(m=>`\n      <div class=\"irow${S.editingMarkerId===m.id?' active-row':''}\"\n          onclick=\"onItemRowClick('${m.id}')\"\n          ondblclick=\"openItemEditor('${m.id}')\"\n          title=\"Click to preview · Double-click to edit\">\n        <div class=\"irow-icon\">${ICONS[m.type]||'📍'}<\u002Fdiv>\n        <div class=\"irow-info\">\n          <div class=\"irow-title\">${escHtml(m.title)}<\u002Fdiv>\n          <div class=\"irow-meta\">\n            <span>${m.type.toUpperCase()}<\u002Fspan>\n            <span class=\"tag warn\">unassigned<\u002Fspan>\n            ${m.media_url?'<span class=\"tag cloud\">☁<\u002Fspan>':''}\n            ${m.lat!=null?`<span class=\"tag loc\">📍${m.lat.toFixed(3)},${m.lon.toFixed(3)}<\u002Fspan>`:''}\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"dbl-hint\">✎ dbl<\u002Fspan>\n        <div class=\"irow-btns\">\n          <button class=\"irow-btn del\" onclick=\"event.stopPropagation();deleteItem('${m.id}')\" title=\"Delete permanently\">✕<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>`).join('');\n    return;\n  }\n  if(panelTitle) panelTitle.textContent=exp.title||'Untitled';\n  const ids=exp.marker_ids||[];\n  if(!ids.length){rows.innerHTML='<div class=\"irow-empty\">No items yet.<br>Click + Add item to begin.<\u002Fdiv>';return;}\n  const items=ids.map(id=>S.markers.find(m=>m.id===id)).filter(Boolean);\n  rows.innerHTML=items.map((m,i)=>`\n    <div class=\"irow${S.editingMarkerId===m.id?' active-row':''}\"\n        onclick=\"onItemRowClick('${m.id}')\"\n        ondblclick=\"openItemEditor('${m.id}')\"\n        title=\"Click to preview · Double-click to edit\">\n      <div class=\"irow-ord\">\n        <button class=\"ord-btn\" onclick=\"event.stopPropagation();moveItem('${m.id}',-1)\" ${i===0?'disabled':''}>▲<\u002Fbutton>\n        <button class=\"ord-btn\" onclick=\"event.stopPropagation();moveItem('${m.id}',1)\"  ${i===items.length-1?'disabled':''}>▼<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"irow-num\">${i+1}<\u002Fdiv>\n      <div class=\"irow-icon\">${ICONS[m.type]||'📍'}<\u002Fdiv>\n      <div class=\"irow-info\">\n        <div class=\"irow-title\">${escHtml(m.title)}<\u002Fdiv>\n        <div class=\"irow-meta\">\n          <span>${m.type.toUpperCase()}<\u002Fspan>\n          ${m.media_url?'<span class=\"tag cloud\">☁<\u002Fspan>':''}\n          ${m.lat!=null?`<span class=\"tag loc\">📍${m.lat.toFixed(3)},${m.lon.toFixed(3)}<\u002Fspan>`:''}\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <span class=\"dbl-hint\">✎ dbl<\u002Fspan>\n      <div class=\"irow-btns\">\n        <button class=\"irow-btn del\" onclick=\"event.stopPropagation();removeItem('${m.id}')\" title=\"Remove\">✕<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>`).join('');\n}\n\n// Single-click on item row: fly map to marker (and play if audio)\nfunction onItemRowClick(markerId) {\n  const m = S.markers.find(x=>x.id===markerId);\n  if (!m) return;\n  if (m.lat!=null) map.setView([m.lat,m.lon],Math.max(map.getZoom(),16),{animate:true});\n  if (m.type==='audio' && m.media_url) playAudio(m);\n}\n\n// ═══════════════════════════════════════════════\n// ITEM EDITOR (left panel overlay)\n// ═══════════════════════════════════════════════\nfunction openItemEditor(markerId) {\n  S.editingMarkerId = markerId;\n  const m = markerId ? S.markers.find(x=>x.id===markerId) : null;\n  S.itemType = m ? m.type : 'audio';\n  S.pendingLat = m?.lat??null;\n  S.pendingLon = m?.lon??null;\n\n  document.getElementById('ieTitleText').textContent = m ? 'Edit: '+m.title : 'New item';\n  buildItemEditorForm(m);\n\n  const ep = document.getElementById('itemEditorPanel');\n  ep.classList.add('open');\n\n  S.drawMode = true;\n  document.getElementById('drawHint').classList.add('on');\n  map.getContainer().style.cursor='crosshair';\n\n  if (m && m.lat!=null) {\n    showZoneHandles(m);\n    map.setView([m.lat,m.lon],Math.max(map.getZoom(),15),{animate:true});\n  }\n  renderItemList();\n}\n\nfunction closeItemEditor(){\n  S.editingMarkerId=null; S.drawMode=false;\n  clearZoneHandles();\n  document.getElementById('drawHint').classList.remove('on');\n  map.getContainer().style.cursor='';\n  document.getElementById('itemEditorPanel').classList.remove('open');\n  renderItemList();\n}\n\nfunction buildItemEditorForm(m) {\n  const isEdit=!!m;\n  const typeChips=['audio','photo','scan3d'].map(t=>`<span class=\"tc${S.itemType===t?' sel '+t:''}${isEdit&&t!==m.type?' locked':''}\" onclick=\"setItemType('${t}')\">${ICONS[t]} ${t==='scan3d'?'3D':t.charAt(0).toUpperCase()+t.slice(1)}<\u002Fspan>`).join('');\n  const existMedia = {\n    audio: isEdit&&m.type==='audio'&&m.media_url ? `<div class=\"existing-media\">🎵 <a href=\"${m.media_url}\" target=\"_blank\">${escHtml(m.media_name||'audio')}<\u002Fa><\u002Fdiv><span class=\"replace-lbl\">Replace (optional)<\u002Fspan>` : '',\n    photo: isEdit&&m.type==='photo'&&m.media_url ? `<div class=\"existing-media\">📷 <a href=\"${m.media_url}\" target=\"_blank\">${escHtml(m.media_name||'image')}<\u002Fa><\u002Fdiv><span class=\"replace-lbl\">Replace (optional)<\u002Fspan>` : '',\n    scan3d:isEdit&&m.type==='scan3d'&&m.media_url? `<div class=\"existing-media\">🧊 <a href=\"${m.media_url}\" target=\"_blank\">${escHtml(m.media_name||'scan')}<\u002Fa><\u002Fdiv><span class=\"replace-lbl\">Replace (optional)<\u002Fspan>` : '',\n  };\n  const coreR=m?.radius??30, fadeR=m?.fade_radius??80, volC=m?.vol_center??100, volE=m?.vol_edge??0;\n  const coordHtml = S.pendingLat!=null\n    ? `<div class=\"coord-confirmed\">${S.pendingLat.toFixed(5)}, ${S.pendingLon.toFixed(5)}<\u002Fdiv>` : '';\n\n  document.getElementById('ieScroll').innerHTML = `\n    <div class=\"ie-type-row\">${typeChips}<\u002Fdiv>\n    <div class=\"fg\"><label class=\"fl\">Title<\u002Flabel><input class=\"fi\" id=\"ieTitle\" value=\"${escHtml(m?.title||'')}\" placeholder=\"Name this stop…\"><\u002Fdiv>\n    <div class=\"fg\"><label class=\"fl\">Excerpt (short teaser)<\u002Flabel><input class=\"fi\" id=\"ieExcerpt\" value=\"${escHtml(m?.excerpt||'')}\" placeholder=\"One sentence shown before visitors expand the full text…\"><\u002Fdiv>\n    <div class=\"fg\"><label class=\"fl\">Description<\u002Flabel><textarea class=\"fi\" id=\"ieDesc\" placeholder=\"What will visitors encounter?\">${escHtml(m?.description||'')}<\u002Ftextarea><\u002Fdiv>\n\n    <div id=\"ieSecAudio\" style=\"display:${S.itemType==='audio'?'block':'none'}\">\n      ${existMedia.audio}\n      <div class=\"fg\"><div class=\"file-drop\"><input type=\"file\" id=\"fAudio\" accept=\"audio/*\"><div class=\"fd-icon\">🎵<\u002Fdiv><div class=\"fd-txt\">Drop or browse<\u002Fdiv><div class=\"fd-name\" id=\"nAudio\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"fg\"><label class=\"fl\">— or record —<\u002Flabel>\n        <div class=\"rec-row\">\n          <button class=\"btn-rec\" id=\"btnRec\">⏺<\u002Fbutton>\n          <div><div class=\"rec-timer\" id=\"recTimer\">00:00<\u002Fdiv><div class=\"rec-status\" id=\"recStatus\">Tap to record<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"ieSecPhoto\" style=\"display:${S.itemType==='photo'?'block':'none'}\">\n      ${existMedia.photo}\n      <div class=\"fg\"><div class=\"file-drop\"><input type=\"file\" id=\"fPhoto\" accept=\"image/*\" capture=\"environment\"><div class=\"fd-icon\">📸<\u002Fdiv><div class=\"fd-txt\">Take photo or browse<\u002Fdiv><div class=\"fd-name\" id=\"nPhoto\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"fg\"><label class=\"fl\">Compass direction (optional)<\u002Flabel><input class=\"fi\" id=\"fDir\" type=\"number\" placeholder=\"0–360°\" value=\"${escHtml(m?.direction||'')}\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"ieSecScan\" style=\"display:${S.itemType==='scan3d'?'block':'none'}\">\n      ${existMedia.scan3d}\n      <div class=\"fg\"><div class=\"file-drop\"><input type=\"file\" id=\"fScan\" accept=\".glb,.gltf,.obj,.ply,.usdz,.splat\"><div class=\"fd-icon\">🧊<\u002Fdiv><div class=\"fd-txt\">Upload scan (.glb, .ply, .obj…)<\u002Fdiv><div class=\"fd-name\" id=\"nScan\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"fg\"><label class=\"fl\">Scan type<\u002Flabel>\n        <select class=\"fi\" id=\"fScanType\">\n          <option value=\"photogrammetry\"${m?.scan_type==='photogrammetry'?' selected':''}>Photogrammetry (.glb/.obj)<\u002Foption>\n          <option value=\"lidar\"${m?.scan_type==='lidar'?' selected':''}>LiDAR (.ply)<\u002Foption>\n          <option value=\"gaussian\"${m?.scan_type==='gaussian'?' selected':''}>Gaussian Splat (.splat)<\u002Foption>\n          <option value=\"usdz\"${m?.scan_type==='usdz'?' selected':''}>USDZ (Apple AR)<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- LOCATION -->\n    <div class=\"loc-box\">\n      <div class=\"loc-box-lbl\">📍 Location<\u002Fdiv>\n      <div class=\"loc-search-wrap\">\n        <input class=\"fi\" id=\"ieLocSearch\" type=\"text\" placeholder=\"🔍 Search for a place…\" autocomplete=\"off\">\n        <div class=\"loc-results\" id=\"ieLocResults\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"coord-grid\">\n        <div><label class=\"fl\">Latitude<\u002Flabel><input class=\"fi\" id=\"ieLat\" type=\"number\" step=\"any\" value=\"${S.pendingLat!=null?S.pendingLat.toFixed(6):''}\" oninput=\"onManualCoord()\"><\u002Fdiv>\n        <div><label class=\"fl\">Longitude<\u002Flabel><input class=\"fi\" id=\"ieLon\" type=\"number\" step=\"any\" value=\"${S.pendingLon!=null?S.pendingLon.toFixed(6):''}\" oninput=\"onManualCoord()\"><\u002Fdiv>\n      <\u002Fdiv>\n      ${coordHtml}\n      <div class=\"map-pin-hint\">Or click anywhere on the map to drop the pin.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ZONE / AUDIO LEVELS -->\n    <div class=\"zone-box\">\n      <div class=\"zone-box-lbl\">🔊 Audio zones<\u002Fdiv>\n      <canvas id=\"zoneDiagram\" class=\"zone-diagram\" width=\"310\" height=\"52\"><\u002Fcanvas>\n\n      <div class=\"zone-row\">\n        <span class=\"zrl\" style=\"color:var(--signal)\">Core radius<\u002Fspan>\n        <input type=\"range\" class=\"zr core\" id=\"ieCoreR\" min=\"5\" max=\"500\" value=\"${coreR}\" oninput=\"onCoreR(this.value)\">\n        <span class=\"zv\" id=\"ieCoreRVal\">${coreR}m<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"zone-row\">\n        <span class=\"zrl\" style=\"color:var(--signal2)\">Fade radius<\u002Fspan>\n        <input type=\"range\" class=\"zr fade\" id=\"ieFadeR\" min=\"10\" max=\"800\" value=\"${fadeR}\" oninput=\"onFadeR(this.value)\">\n        <span class=\"zv\" id=\"ieFadeRVal\">${fadeR}m<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"zone-row\">\n        <span class=\"zrl\" style=\"color:var(--ok)\">Centre vol.<\u002Fspan>\n        <input type=\"range\" class=\"zr vc\" id=\"ieVolC\" min=\"0\" max=\"100\" value=\"${volC}\" oninput=\"drawZoneDiagram()\">\n        <span class=\"zv\" id=\"ieVolCVal\" style=\"color:var(--ok)\">${volC}%<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"zone-row\">\n        <span class=\"zrl\" style=\"color:var(--muted)\">Edge vol.<\u002Fspan>\n        <input type=\"range\" class=\"zr ve\" id=\"ieVolE\" min=\"0\" max=\"100\" value=\"${volE}\" oninput=\"drawZoneDiagram()\">\n        <span class=\"zv\" id=\"ieVolEVal\" style=\"color:var(--muted)\">${volE}%<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"zone-hint\">Drag the ◉ handles on the map to resize zones, or use the sliders above. Centre vol = loudness in the core. Edge vol = loudness at the fade boundary.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"up-prog\" id=\"upProg\"><div class=\"up-prog-top\"><span>Uploading…<\u002Fspan><span id=\"upPct\">0%<\u002Fspan><\u002Fdiv><div class=\"up-bar\"><div class=\"up-fill\" id=\"upFill\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"up-status\" id=\"upStatus\"><\u002Fdiv>\n\n    <button class=\"ie-save ${S.itemType!=='audio'?S.itemType:''}\" id=\"ieSaveBtn\" onclick=\"saveItem()\">${isEdit?'SAVE CHANGES':'ADD TO EXPERIENCE'}<\u002Fbutton>\n    ${isEdit?`<button class=\"ie-delete\" onclick=\"deleteItem('${m.id}')\">DELETE ITEM PERMANENTLY<\u002Fbutton>`:''}\n    <button class=\"ie-cancel\" onclick=\"closeItemEditor()\">cancel<\u002Fbutton>\n  `;\n\n  // Wire file inputs\n  setTimeout(()=>{\n    const fa=document.getElementById('fAudio');if(fa)fa.onchange=e=>{if(e.target.files[0])document.getElementById('nAudio').textContent=e.target.files[0].name;};\n    const fp=document.getElementById('fPhoto');if(fp)fp.onchange=e=>{if(e.target.files[0])document.getElementById('nPhoto').textContent=e.target.files[0].name;};\n    const fs=document.getElementById('fScan');if(fs)fs.onchange=e=>{if(e.target.files[0])document.getElementById('nScan').textContent=e.target.files[0].name;};\n    wireLocSearch();\n    wireRecording();\n    drawZoneDiagram();\n  },0);\n}\n\nfunction setItemType(t){\n  if(S.editingMarkerId) return;\n  S.itemType=t;\n  document.querySelectorAll('.tc').forEach(c=>{\n    const ct=c.getAttribute('onclick').match(/'([^']+)'/)?.[1];\n    c.classList.remove('sel','audio','photo','scan3d');\n    if(ct===t) c.classList.add('sel',t);\n  });\n  ['Audio','Photo','Scan'].forEach(n=>{\n    const id='ieSec'+(n==='Scan'?'Scan':n);\n    const el=document.getElementById(id); if(el) el.style.display=(n.toLowerCase()===t||(n==='Scan'&&t==='scan3d'))?'block':'none';\n  });\n  const btn=document.getElementById('ieSaveBtn'); if(btn) btn.className='ie-save '+(t!=='audio'?t:'');\n}\n\n// ── Location search ──\nfunction wireLocSearch(){\n  const inp=document.getElementById('ieLocSearch'); if(!inp) return;\n  let lt=null;\n  inp.addEventListener('input',e=>{\n    clearTimeout(lt); const q=e.target.value.trim();\n    if(q.length<3){closeLocRes();return;}\n    lt=setTimeout(()=>doLocSearch(q),400);\n  });\n  inp.addEventListener('blur',()=>setTimeout(closeLocRes,200));\n}\nasync function doLocSearch(q){\n  const res=document.getElementById('ieLocResults'); if(!res) return;\n  res.innerHTML='<div class=\"loc-loading\">Searching…<\u002Fdiv>'; res.classList.add('open');\n  try{\n    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=5`,{headers:{'Accept-Language':'en'}});\n    const d=await r.json();\n    if(!d.length){res.innerHTML='<div class=\"loc-loading\">No results<\u002Fdiv>';return;}\n    res.innerHTML=d.map(x=>`<div class=\"loc-result-item\" onclick=\"pickLocResult(${x.lat},${x.lon},'${x.display_name.replace(/'/g,\"\\\\'\").replace(/<\u002Fg,'&lt;')}')\"><div class=\"loc-result-name\">${x.display_name.split(',')[0]}<\u002Fdiv><div class=\"loc-result-sub\">${x.display_name.split(',').slice(1,3).join(',').trim()}<\u002Fdiv><\u002Fdiv>`).join('');\n  }catch{res.innerHTML='<div class=\"loc-loading\">Search failed<\u002Fdiv>';}\n}\nfunction pickLocResult(lat,lon,name){\n  setCoords(parseFloat(lat),parseFloat(lon));\n  const inp=document.getElementById('ieLocSearch'); if(inp) inp.value=name.split(',')[0];\n  closeLocRes();\n  map.setView([parseFloat(lat),parseFloat(lon)],16,{animate:true});\n  if(S.editingMarkerId){const m=S.markers.find(x=>x.id===S.editingMarkerId);if(m){m.lat=parseFloat(lat);m.lon=parseFloat(lon);refreshMapMarker(m);showZoneHandles(m);}}\n  toast('📍 '+name.split(',')[0]);\n}\nfunction closeLocRes(){const el=document.getElementById('ieLocResults');if(el)el.classList.remove('open');}\nfunction onManualCoord(){\n  const lat=parseFloat(document.getElementById('ieLat')?.value);\n  const lon=parseFloat(document.getElementById('ieLon')?.value);\n  if(!isNaN(lat)&&!isNaN(lon)) setCoords(lat,lon);\n}\nfunction setCoords(lat,lon){\n  S.pendingLat=lat; S.pendingLon=lon;\n  const elLat=document.getElementById('ieLat'),elLon=document.getElementById('ieLon');\n  if(elLat) elLat.value=lat.toFixed(6);\n  if(elLon) elLon.value=lon.toFixed(6);\n  let cc=document.querySelector('.coord-confirmed');\n  if(!cc){cc=document.createElement('div');cc.className='coord-confirmed';const hint=document.querySelector('.map-pin-hint');if(hint)hint.before(cc);}\n  cc.textContent=`${lat.toFixed(5)}, ${lon.toFixed(5)}`;\n}\n\n// ── Zone slider handlers ──\nfunction onCoreR(v){\n  v=parseInt(v); document.getElementById('ieCoreRVal').textContent=v+'m';\n  if(S.editingMarkerId){const m=S.markers.find(x=>x.id===S.editingMarkerId);if(m){m.radius=v;if(S.coreCircles[m.id])S.coreCircles[m.id].setRadius(v);}}\n  const fe=document.getElementById('ieFadeR');\n  if(fe&&parseInt(fe.value)<v+5){fe.value=v+5;onFadeR(v+5);}\n  drawZoneDiagram();\n}\nfunction onFadeR(v){\n  v=parseInt(v);\n  const ce=document.getElementById('ieCoreR'); const cV=ce?parseInt(ce.value):30;\n  v=Math.max(cV+5,v); document.getElementById('ieFadeRVal').textContent=v+'m';\n  const fe=document.getElementById('ieFadeR'); if(fe) fe.value=v;\n  if(S.editingMarkerId){const m=S.markers.find(x=>x.id===S.editingMarkerId);if(m){m.fade_radius=v;if(S.fadeCircles[m.id])S.fadeCircles[m.id].setRadius(v);}}\n  drawZoneDiagram();\n}\n\n// ── Zone diagram ──\nfunction drawZoneDiagram(){\n  const canvas=document.getElementById('zoneDiagram'); if(!canvas) return;\n  const ctx=canvas.getContext('2d');\n  const W=canvas.width, H=canvas.height;\n  ctx.clearRect(0,0,W,H);\n\n  const coreR=parseInt(document.getElementById('ieCoreR')?.value??30);\n  const fadeR=parseInt(document.getElementById('ieFadeR')?.value??80);\n  const volC=parseInt(document.getElementById('ieVolC')?.value??100);\n  const volE=parseInt(document.getElementById('ieVolE')?.value??0);\n\n  const vc=document.getElementById('ieVolCVal'),ve=document.getElementById('ieVolEVal');\n  if(vc) vc.textContent=volC+'%';\n  if(ve) ve.textContent=volE+'%';\n\n  const cx=W/2, scale=(W*0.46)/fadeR;\n  ctx.fillStyle='rgba(16,48,40,.025)'; ctx.fillRect(0,0,W,H);\n\n  const g=ctx.createLinearGradient(cx,0,W,0);\n  g.addColorStop(0,`rgba(232,255,60,${volC/100*.45})`);\n  g.addColorStop(Math.min(coreR/fadeR,.99),`rgba(232,255,60,${volC/100*.45})`);\n  g.addColorStop(1,`rgba(60,255,232,${volE/100*.35})`);\n  ctx.fillStyle=g;\n  ctx.beginPath(); ctx.moveTo(0,H);\n  for(let x=0;x<=W;x++){\n    const dist=Math.abs(x-cx)/scale;\n    let vol;\n    if(dist<=coreR) vol=volC/100;\n    else if(dist<=fadeR) vol=volE/100+(volC/100-volE/100)*(1-(dist-coreR)/(fadeR-coreR));\n    else vol=volE/100;\n    x===0?ctx.moveTo(x,H-(vol*(H-5))):ctx.lineTo(x,H-(vol*(H-5)));\n  }\n  for(let x=W;x>=0;x--){ctx.lineTo(x,H);}\n  ctx.closePath(); ctx.fill();\n\n  ctx.beginPath(); ctx.strokeStyle='rgba(63,143,127,.75)'; ctx.lineWidth=1.5;\n  for(let x=0;x<=W;x++){\n    const dist=Math.abs(x-cx)/scale;\n    let vol;\n    if(dist<=coreR) vol=volC/100;\n    else if(dist<=fadeR) vol=volE/100+(volC/100-volE/100)*(1-(dist-coreR)/(fadeR-coreR));\n    else vol=volE/100;\n    const y=H-(vol*(H-5));\n    x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);\n  }\n  ctx.stroke();\n\n  const corePx=cx+(coreR/fadeR)*(W/2);\n  ctx.beginPath(); ctx.strokeStyle='rgba(63,143,127,.25)'; ctx.lineWidth=1; ctx.setLineDash([3,4]);\n  ctx.moveTo(corePx,0);ctx.lineTo(corePx,H);\n  ctx.moveTo(W-corePx,0);ctx.lineTo(W-corePx,H);\n  ctx.stroke(); ctx.setLineDash([]);\n\n  ctx.font='8px DM Mono,monospace'; ctx.textAlign='center';\n  ctx.fillStyle='rgba(63,143,127,.55)'; ctx.fillText('CORE',cx,9);\n  ctx.fillStyle='rgba(87,194,196,.5)'; ctx.textAlign='right'; ctx.fillText('FADE',W-3,9);\n}\n\n// ── Recording ──\nfunction wireRecording(){\n  const btn=document.getElementById('btnRec'); if(!btn) return;\n  btn.onclick=async()=>{\n    if(S.recording){stopRecording();return;}\n    try{\n      const stream=await navigator.mediaDevices.getUserMedia({audio:true});\n      S.recChunks=[]; S.recorder=new MediaRecorder(stream);\n      S.recorder.ondataavailable=e=>S.recChunks.push(e.data);\n      S.recorder.onstop=()=>{\n        S.recordingBlob=new Blob(S.recChunks,{type:'audio/webm'});\n        document.getElementById('recStatus').textContent='Recording saved ✓';\n        document.getElementById('nAudio').textContent='rec_'+Date.now()+'.webm';\n      };\n      S.recorder.start(); S.recording=true; S.recSeconds=0;\n      btn.classList.add('on'); document.getElementById('recStatus').textContent='Recording…';\n      S.recInterval=setInterval(()=>{\n        S.recSeconds++;\n        const mm=Math.floor(S.recSeconds/60).toString().padStart(2,'0');\n        const ss=(S.recSeconds%60).toString().padStart(2,'0');\n        const rt=document.getElementById('recTimer'); if(rt){rt.textContent=mm+':'+ss;rt.classList.add('on');}\n      },1000);\n    }catch{toast('Microphone access denied','err');}\n  };\n}\nfunction stopRecording(){\n  if(S.recorder&&S.recording){S.recorder.stop();S.recorder.stream?.getTracks().forEach(t=>t.stop());}\n  S.recording=false; clearInterval(S.recInterval);\n  const btn=document.getElementById('btnRec'); if(btn) btn.classList.remove('on');\n  const rt=document.getElementById('recTimer'); if(rt) rt.classList.remove('on');\n}\n\n// ═══════════════════════════════════════════════\n// SAVE ITEM\n// ═══════════════════════════════════════════════\nasync function saveItem(){\n  const btn=document.getElementById('ieSaveBtn'); if(!btn) return;\n  btn.disabled=true; btn.textContent='SAVING…';\n  const title=(document.getElementById('ieTitle')?.value||'').trim()||'Untitled';\n  const excerpt=(document.getElementById('ieExcerpt')?.value||'').trim();\n  const desc=(document.getElementById('ieDesc')?.value||'').trim();\n  const latV=parseFloat(document.getElementById('ieLat')?.value);\n  const lonV=parseFloat(document.getElementById('ieLon')?.value);\n  const lat=!isNaN(latV)?latV:(S.pendingLat??map.getCenter().lat);\n  const lon=!isNaN(lonV)?lonV:(S.pendingLon??map.getCenter().lng);\n  const coreR=parseInt(document.getElementById('ieCoreR')?.value)||30;\n  const fadeR=parseInt(document.getElementById('ieFadeR')?.value)||80;\n  const volC=parseInt(document.getElementById('ieVolC')?.value)??100;\n  const volE=parseInt(document.getElementById('ieVolE')?.value)??0;\n\n  let file=null;\n  if(S.itemType==='audio'){file=document.getElementById('fAudio')?.files[0]||null;if(!file&&S.recordingBlob)file=new File([S.recordingBlob],'rec_'+Date.now()+'.webm',{type:'audio/webm'});}\n  else if(S.itemType==='photo') file=document.getElementById('fPhoto')?.files[0]||null;\n  else if(S.itemType==='scan3d') file=document.getElementById('fScan')?.files[0]||null;\n\n  if(S.editingMarkerId){\n    const m=S.markers.find(x=>x.id===S.editingMarkerId); if(!m){btn.disabled=false;return;}\n    if(file){btn.textContent='UPLOADING…';const url=await uploadMedia(file,m.id);if(url){m.media_url=url;m.media_name=file.name;}}\n    m.title=title;m.excerpt=excerpt;m.description=desc;m.lat=lat;m.lon=lon;\n    m.radius=coreR;m.fade_radius=fadeR;m.vol_center=volC;m.vol_edge=volE;\n    if(m.type==='photo')m.direction=document.getElementById('fDir')?.value||null;\n    if(m.type==='scan3d')m.scan_type=document.getElementById('fScanType')?.value;\n    const{error}=await sb.from('markers').update({title:m.title,excerpt:m.excerpt,description:m.description,lat:m.lat,lon:m.lon,radius:m.radius,fade_radius:m.fade_radius,vol_center:m.vol_center,vol_edge:m.vol_edge,media_url:m.media_url,media_name:m.media_name,direction:m.direction,scan_type:m.scan_type}).eq('id',m.id);\n    btn.disabled=false; btn.textContent='SAVE CHANGES';\n    if(error){toast('Update failed: '+error.message,'err');return;}\n    refreshMapMarker(m);\n    S.recordingBlob=null;\n    closeItemEditor();\n    const exp=S.experiences.find(e=>e.id===S.currentExpId);\n    if(exp){renderItemList();if(document.getElementById('expEditorPanel').style.display!=='none')renderEdItemList(exp);}\n    toast('✓ Item updated','ok');\n    map.setView([m.lat,m.lon],Math.max(map.getZoom(),16),{animate:true});\n  } else {\n    if(!S.currentExpId){toast('Select or create an experience first','err');btn.disabled=false;btn.textContent='ADD TO EXPERIENCE';return;}\n    const id='m'+Date.now()+'_'+Math.random().toString(36).slice(2,6);\n    const marker={id,title,excerpt,description:desc,type:S.itemType,lat,lon,radius:coreR,fade_radius:fadeR,vol_center:volC,vol_edge:volE,created_at:new Date().toISOString(),media_url:null,media_name:null,direction:null,scan_type:null};\n    if(S.itemType==='photo')marker.direction=document.getElementById('fDir')?.value||null;\n    if(S.itemType==='scan3d')marker.scan_type=document.getElementById('fScanType')?.value;\n    if(file){marker.media_name=file.name;btn.textContent='UPLOADING…';const url=await uploadMedia(file,id);if(url)marker.media_url=url;}\n    btn.textContent='SAVING…';\n    const{error}=await sb.from('markers').insert(marker);\n    if(error){btn.disabled=false;btn.textContent='ADD TO EXPERIENCE';toast('DB error: '+error.message,'err');return;}\n    S.markers.push(marker);\n    if(marker.lat!=null)placeMapMarker(marker);\n    const exp=S.experiences.find(e=>e.id===S.currentExpId);\n    if(exp){exp.marker_ids=[...(exp.marker_ids||[]),marker.id];exp.updated_at=new Date().toISOString();await sb.from('experiences').update({marker_ids:exp.marker_ids,updated_at:exp.updated_at}).eq('id',exp.id);}\n    btn.disabled=false; S.recordingBlob=null;\n    updateStats(); closeItemEditor();\n    if(exp){renderItemList();if(document.getElementById('expEditorPanel').style.display!=='none')renderEdItemList(exp);}\n    toast(marker.media_url?'☁ Item added':'✓ Item added','ok');\n    if(marker.lat!=null)map.setView([marker.lat,marker.lon],Math.max(map.getZoom(),16));\n  }\n}\n\n// ═══════════════════════════════════════════════\n// EXPERIENCE CRUD\n// ═══════════════════════════════════════════════\nfunction newExp(){\n  const exp={id:'e'+Date.now(),title:'',tagline:'',location_label:'',description:'',cover_url:'',duration:'',status:'draft',marker_ids:[],created_at:new Date().toISOString(),updated_at:new Date().toISOString()};\n  S.experiences.unshift(exp); S.currentExpId=exp.id;\n  switchTab('exp'); renderExpList(); openExpEditor(exp.id);\n  setTimeout(()=>document.getElementById('edTitle')?.focus(),60);\n}\nasync function saveExp(){\n  const exp=S.experiences.find(e=>e.id===S.currentExpId); if(!exp) return;\n  exp.title=document.getElementById('edTitle').value.trim()||'Untitled';\n  exp.tagline=document.getElementById('edTagline').value.trim();\n  exp.location_label=document.getElementById('edLocation').value.trim();\n  exp.duration=document.getElementById('edDuration').value.trim();\n  exp.description=document.getElementById('edDesc').value.trim();\n  exp.cover_url=document.getElementById('edCover').value.trim();\n  exp.updated_at=new Date().toISOString();\n  const{error}=await sb.from('experiences').upsert(exp);\n  if(!error){renderExpList();document.getElementById('mapPanelTitle').textContent=exp.title||'Untitled';toast('☁ Saved','ok');}\n  else toast('Save failed: '+error.message,'err');\n}\nasync function setStatus(status){\n  const exp=S.experiences.find(e=>e.id===S.currentExpId); if(!exp) return;\n  exp.status=status; exp.updated_at=new Date().toISOString();\n  const{error}=await sb.from('experiences').update({status:exp.status,updated_at:exp.updated_at}).eq('id',exp.id);\n  if(error){toast('Status update failed: '+error.message,'err');return;}\n  renderExpList(); highlightStatusSeg(status);\n  toast(status==='published'?'✓ Published':status==='coming_soon'?'✓ Marked coming soon':'Set to draft','ok');\n}\nasync function deleteExp(){\n  if(!confirm('Delete this experience? Items will not be deleted.')) return;\n  await sb.from('experiences').delete().eq('id',S.currentExpId);\n  S.experiences=S.experiences.filter(e=>e.id!==S.currentExpId); S.currentExpId=null;\n  closeExpEditor(); renderExpList(); renderItemList();\n}\nfunction exportExp(){\n  const exp=S.experiences.find(e=>e.id===S.currentExpId); if(!exp) return;\n  const items=(exp.marker_ids||[]).map(id=>S.markers.find(m=>m.id===id)).filter(Boolean).map((m,i)=>({order:i+1,id:m.id,title:m.title,excerpt:m.excerpt||'',description:m.description||'',type:m.type,lat:m.lat,lon:m.lon,radius:m.radius||30,fade_radius:m.fade_radius||80,vol_center:m.vol_center??100,vol_edge:m.vol_edge??0,media_url:m.media_url||null,media_name:m.media_name||null}));\n  const payload={fieldcast_version:2,exported:new Date().toISOString(),experience:{id:exp.id,title:exp.title,tagline:exp.tagline||'',location_label:exp.location_label||'',description:exp.description||'',cover_url:exp.cover_url||'',duration:exp.duration||'',status:exp.status},items};\n  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download=(exp.title||'experience').toLowerCase().replace(/\\s+/g,'-')+'.json';a.click();URL.revokeObjectURL(a.href);toast('↓ Exported','ok');\n}\n\nasync function moveItem(markerId,dir){\n  const exp=S.experiences.find(e=>e.id===S.currentExpId); if(!exp) return;\n  const ids=[...(exp.marker_ids||[])];\n  const i=ids.indexOf(markerId),j=i+dir;\n  if(j<0||j>=ids.length) return;\n  [ids[i],ids[j]]=[ids[j],ids[i]]; exp.marker_ids=ids;\n  await sb.from('experiences').update({marker_ids:ids,updated_at:new Date().toISOString()}).eq('id',exp.id);\n  renderItemList(); renderEdItemList(exp);\n}\nasync function removeItem(markerId){\n  const exp=S.experiences.find(e=>e.id===S.currentExpId); if(!exp) return;\n  exp.marker_ids=(exp.marker_ids||[]).filter(x=>x!==markerId);\n  await sb.from('experiences').update({marker_ids:exp.marker_ids,updated_at:new Date().toISOString()}).eq('id',exp.id);\n  renderItemList(); renderEdItemList(exp); toast('Item removed');\n}\n\n// Permanently deletes a marker row, regardless of whether it's currently\n// linked to an experience — unlinks it from every experience that still\n// references it (e.g. a leftover from a deleted experience) so no dangling\n// ids remain in any marker_ids array.\nasync function deleteItem(markerId){\n  const m=S.markers.find(x=>x.id===markerId); if(!m) return;\n  if(!confirm(`Delete \"${m.title||'this item'}\" permanently? This cannot be undone.`)) return;\n\n  const{error}=await sb.from('markers').delete().eq('id',markerId);\n  if(error){toast('Delete failed: '+error.message,'err');return;}\n\n  const affected=S.experiences.filter(e=>(e.marker_ids||[]).includes(markerId));\n  for(const e of affected){\n    e.marker_ids=(e.marker_ids||[]).filter(x=>x!==markerId);\n    e.updated_at=new Date().toISOString();\n    await sb.from('experiences').update({marker_ids:e.marker_ids,updated_at:e.updated_at}).eq('id',e.id);\n  }\n\n  S.markers=S.markers.filter(x=>x.id!==markerId);\n  removeMapMarker(markerId);\n  if(S.editingMarkerId===markerId) closeItemEditor();\n\n  renderItemList(); renderExpList(); updateStats();\n  const openExp=S.experiences.find(e=>e.id===S.currentExpId);\n  if(openExp && document.getElementById('expEditorPanel').style.display!=='none') renderEdItemList(openExp);\n  toast('✓ Item deleted','ok');\n}\n\n// ═══════════════════════════════════════════════\n// UPLOAD\n// ═══════════════════════════════════════════════\nasync function uploadMedia(file,id){\n  const ext=(file.name||'file').split('.').pop()||'bin';\n  const path=id+'.'+ext;\n  const prog=document.getElementById('upProg'); if(prog)prog.classList.add('show');\n  let pct=0; const tick=setInterval(()=>{pct=Math.min(pct+7,88);setUpPct(pct);},200);\n  const{error}=await sb.storage.from(BUCKET).upload(path,file,{cacheControl:'31536000',upsert:true,contentType:file.type||'application/octet-stream'});\n  clearInterval(tick); setUpPct(100);\n  setTimeout(()=>{if(prog)prog.classList.remove('show');},600);\n  if(error){setUpStatus('Upload failed: '+error.message,true);return null;}\n  const{data:{publicUrl}}=sb.storage.from(BUCKET).getPublicUrl(path);\n  setUpStatus('☁ Uploaded',false); return publicUrl;\n}\nfunction setUpPct(p){const f=document.getElementById('upFill'),l=document.getElementById('upPct');if(f)f.style.width=p+'%';if(l)l.textContent=p+'%';}\nfunction setUpStatus(msg,isErr){const el=document.getElementById('upStatus');if(!el)return;el.textContent=msg;el.className='up-status show'+(isErr?' err':'');if(!isErr)setTimeout(()=>el.classList.remove('show'),4000);}\n\n// ═══════════════════════════════════════════════\n// STATS\n// ═══════════════════════════════════════════════\nfunction updateStats(){\n  document.getElementById('cA').textContent=S.markers.filter(m=>m.type==='audio').length;\n  document.getElementById('cP').textContent=S.markers.filter(m=>m.type==='photo').length;\n  document.getElementById('cS').textContent=S.markers.filter(m=>m.type==='scan3d').length;\n  document.getElementById('cE').textContent=S.experiences.length;\n  document.getElementById('cC').textContent=S.markers.filter(m=>m.media_url).length;\n}\n\n// ═══════════════════════════════════════════════\n// AUDIO PLAYBACK\n// ═══════════════════════════════════════════════\nfunction playAudio(m){\n  if(!m.media_url){toast('No audio file','err');return;}\n  if(S.curAudioEl)S.curAudioEl.pause();\n  if(S.curAudio){const lm=S.leafletMarkers[S.curAudio.id];if(lm)lm.setIcon(mkIcon(S.curAudio));}\n  const a=new Audio(m.media_url); S.curAudioEl=a; S.curAudio=m;\n  const lm=S.leafletMarkers[m.id]; if(lm)lm.setIcon(mkIcon(m,true));\n  document.getElementById('npStrip').classList.add('on');\n  document.getElementById('npTitle').textContent=m.title;\n  document.getElementById('npMeta').textContent='🎙 '+(m.media_name||'audio');\n  document.getElementById('npWave').classList.remove('paused');\n  document.getElementById('btnPP').textContent='⏸';\n  a.play();\n  a.onended=()=>{document.getElementById('npWave').classList.add('paused');document.getElementById('btnPP').textContent='▶';if(lm)lm.setIcon(mkIcon(m));};\n}\ndocument.getElementById('btnPP').onclick=()=>{if(!S.curAudioEl)return;if(S.curAudioEl.paused){S.curAudioEl.play();document.getElementById('npWave').classList.remove('paused');document.getElementById('btnPP').textContent='⏸';}else{S.curAudioEl.pause();document.getElementById('npWave').classList.add('paused');document.getElementById('btnPP').textContent='▶';}};\ndocument.getElementById('btnStop').onclick=()=>{if(S.curAudioEl){S.curAudioEl.pause();S.curAudioEl=null;}document.getElementById('npStrip').classList.remove('on');if(S.curAudio){const lm=S.leafletMarkers[S.curAudio.id];if(lm)lm.setIcon(mkIcon(S.curAudio));}};\n\n// ═══════════════════════════════════════════════\n// HEADER SEARCH\n// ═══════════════════════════════════════════════\nlet hdrST=null;\ndocument.getElementById('hdrSearchInput').addEventListener('input',e=>{\n  clearTimeout(hdrST); const q=e.target.value.trim();\n  if(q.length<3){document.getElementById('hdrSearchDrop').classList.remove('open');return;}\n  hdrST=setTimeout(()=>doHdrSearch(q),400);\n});\ndocument.getElementById('hdrSearchInput').addEventListener('blur',()=>setTimeout(()=>document.getElementById('hdrSearchDrop').classList.remove('open'),200));\nasync function doHdrSearch(q){\n  const drop=document.getElementById('hdrSearchDrop');\n  drop.innerHTML='<div class=\"hsd-loading\">Searching…<\u002Fdiv>'; drop.classList.add('open');\n  try{\n    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=5`,{headers:{'Accept-Language':'en'}});\n    const d=await r.json();\n    if(!d.length){drop.innerHTML='<div class=\"hsd-loading\">No results<\u002Fdiv>';return;}\n    drop.innerHTML=d.map(x=>`<div class=\"hsd-item\" onclick=\"flyToHdr(${x.lat},${x.lon},'${x.display_name.replace(/'/g,\"\\\\'\").replace(/<\u002Fg,'&lt;')}')\"><div class=\"hsd-name\">${x.display_name.split(',')[0]}<\u002Fdiv><div class=\"hsd-sub\">${x.display_name.split(',').slice(1,3).join(',').trim()}<\u002Fdiv><\u002Fdiv>`).join('');\n  }catch{drop.innerHTML='<div class=\"hsd-loading\">Search failed<\u002Fdiv>';}\n}\nfunction flyToHdr(lat,lon,name){\n  map.setView([parseFloat(lat),parseFloat(lon)],16,{animate:true});\n  document.getElementById('hdrSearchInput').value=name.split(',')[0];\n  document.getElementById('hdrSearchDrop').classList.remove('open');\n  toast('🗺 '+name.split(',')[0]);\n}\n\n// ═══════════════════════════════════════════════\n// UTILS\n// ═══════════════════════════════════════════════\nfunction escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');}\nfunction toast(msg,type=''){\n  const el=document.getElementById('toast');\n  el.textContent=msg; el.className='toast '+type+' show';\n  clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),3000);\n}\n\n// Boot\nswitchTab('map');\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
